[project]
name = "doc-processor-prototype"
version = "0.1.0"
description = "Backend del prototipo doc-processor: API FastAPI + Celery + Postgres + agente OpenRouter/determinista"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "celery>=5.4",
    "redis>=5.0",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.12",
    "openrouter>=1.3.190",
    "flower>=1.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
